name: Build Notes APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unpack project and add latest index.html
        run: |
          unzip -q android-project.zip -d build-app
          cp index.html build-app/app/src/main/assets/www/index.html
      - name: Build APK
        working-directory: build-app
        run: gradle --no-daemon assembleDebug -PverCode=${{ github.run_number }}
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build-app/app/build/outputs/apk/debug/app-debug.apk Notes.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Notes.apk --target ${{ github.sha }} --title "Notes app (latest)" --notes "Download Notes.apk and install it."
