<style>
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--ink:#202124;--accent:#FBBC04;--on-accent:#202124;--fs:16px;
  --font:"Roboto",system-ui,sans-serif;
  --muted:color-mix(in srgb,var(--ink) 62%,transparent);--line:color-mix(in srgb,var(--ink) 16%,transparent);--field:color-mix(in srgb,var(--ink) 7%,transparent);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#202124;--surface:#202124;--ink:#E8EAED}
}
:root[data-theme="dark"]{--bg:#202124;--surface:#202124;--ink:#E8EAED}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;color:var(--ink);font:400 var(--fs)/1.45 var(--font);min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 110px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:1.9em;line-height:1.1;font-weight:800;color:var(--head,var(--ink))}
.sub{color:var(--muted);font-size:.9em}
.icon{width:46px;height:46px;border-radius:50%;border:0;background:var(--field);font-size:1.1em}
.widget{margin:14px 0 6px;padding:16px 18px;border-radius:18px;border-left:5px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));cursor:pointer}
.wq{margin:0;font-size:1.2em;line-height:1.35;font-weight:600;color:var(--head,var(--ink));white-space:pre-wrap;overflow-wrap:anywhere}
.wq.ph{opacity:.6;font-weight:400}
.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:8px 0 4px;background:var(--hdr,var(--surface))}
.search{width:100%;height:46px;border-radius:23px;border:0;background:var(--field);padding:0 18px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.chips:empty{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:16px;padding:4px 14px}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
h2{font-size:.9em;font-weight:700;color:var(--head,var(--ink));margin:18px 2px 8px}
.cols{column-count:2;column-gap:10px}
#list.list .cols{column-count:1}
@media (min-width:700px){#list.grid .cols{column-count:3}}
.card{break-inside:avoid;margin:0 0 10px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;overflow-wrap:anywhere}
.card h3{margin:0 0 4px;font-size:1.05em;font-weight:800}
.card p{margin:0;white-space:pre-wrap;opacity:.9}
.ci{display:flex;gap:6px;align-items:flex-start}
.cb{border:0;background:none;padding:0;line-height:1.45;font-size:1.1em;color:inherit}
.dn span{text-decoration:line-through;opacity:.55}
.more{opacity:.6;font-size:.85em}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tags span{font-size:.75em;border:1px solid currentColor;opacity:.7;border-radius:10px;padding:0 8px}
.empty{text-align:center;color:var(--muted);margin:70px 20px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));height:56px;padding:0 22px;border:0;border-radius:28px;background:var(--accent);color:var(--on-accent);font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.panel input[type=text],.panel textarea{width:100%;border:0;background:transparent;outline:none;padding:6px 2px}
.panel .field,.panel input.field[type=text],.panel textarea.field{border:1px solid var(--line);border-radius:12px;padding:8px 10px}
#t{font-size:1.3em;font-weight:800}
#b{min-height:200px;resize:none}
#l{border-top:1px solid var(--line)!important;padding-top:10px!important;font-size:.9em}
#wt{min-height:100px;resize:none}
#wdays{width:90px}
#items{display:flex;flex-direction:column;gap:4px;min-height:160px}
.it{display:flex;align-items:center;gap:8px}
.it input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.itx{flex:1;border-bottom:1px solid var(--line)!important}
.x{border:0;background:none;opacity:.6}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.sel{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;border-radius:20px;padding:8px 14px}

.btn{border:1px solid var(--line);background:transparent;border-radius:20px;padding:8px 16px}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.arm{background:#B3261E;color:#fff;border-color:#B3261E}
.set h3{margin:0;font-size:.9em;color:var(--muted);font-weight:600}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.lnk{border:0;background:none;padding:4px 2px;font-size:.85em;text-decoration:underline;opacity:.75}
.dot{position:relative;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);padding:0;background:var(--surface)}
.dot.sm{width:32px;height:32px}
.dot.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.dot.auto{background-image:linear-gradient(135deg,transparent 46%,var(--ink) 47% 53%,transparent 54%)}
.dot.pick{display:inline-block;background:conic-gradient(#e66,#ec6,#6c8,#6ce,#88e,#e8c,#e66)}
.dot.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.sheet{animation:fade .2s ease}
.sheet .panel{animation:rise .3s cubic-bezier(.2,.8,.2,1);will-change:transform,opacity;overscroll-behavior:contain}
.sheet.out{animation:fadeout .18s ease forwards}
.sheet.out .panel{animation:drop .18s ease forwards}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes rise{from{transform:translateY(48px);opacity:0}}
@keyframes drop{to{transform:translateY(48px);opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
@keyframes bump{50%{transform:scale(1.18)}}
@keyframes cardpop{from{opacity:0;transform:scale(.85) translateY(12px)}}
.card,.chip,.btn,.fab,.icon,.dot,.mi,.sg,.fr{transition:transform .16s ease,background-color .18s ease}
.card:active,.chip:active,.btn:active,.dot:active,.mi:active{transform:scale(.95)}
.fab:active{transform:scale(.92)}
.icon:active{transform:rotate(70deg) scale(.92)}
.bump{animation:bump .3s ease}
.card.pop{animation:cardpop .35s cubic-bezier(.2,.8,.2,1)}
.menu{position:fixed;z-index:40;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.28);animation:pop .18s cubic-bezier(.2,.8,.2,1);max-height:70vh;overflow:auto}
.mi{display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%;border:0;background:none;text-align:left;padding:12px 14px;border-radius:14px}
.mi:hover,.mi:focus-visible{background:var(--field)}
.mi[aria-selected="true"]{font-weight:700}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none}
.mi[aria-selected="true"] .rd{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.set .row{gap:10px}
.sethead{position:sticky;top:-16px;z-index:3;display:flex;justify-content:space-between;align-items:center;margin:-16px -16px 6px;padding:16px;background:var(--surface)}
.set .ttl{margin:0;font-size:1.3em;font-weight:700;color:var(--ink)}
.grp{background:var(--field);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--field)}
.sg{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:10px;font-size:.92em}
.sg[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);font-weight:700}
.fl{display:flex;flex-direction:column}
.fr{display:flex;align-items:center;justify-content:space-between;border:0;background:none;text-align:left;padding:11px 2px;font-size:1.05em;border-bottom:1px solid var(--line)}
.fr:last-child{border-bottom:0}
.fr[aria-pressed="true"] .rd{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.cr{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line)}
.cr:last-child{border-bottom:0}
.reset{width:100%;border:1px solid var(--line);background:transparent;border-radius:14px;padding:12px;margin:4px 0 6px;color:#B3261E;font-weight:600}
.sg:active,.fr:active{transform:scale(.97)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bg)}
html{background-color:var(--surface)}
*{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.icg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ic{border:0;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.72em;color:var(--muted)}
.ic img{width:100%;max-width:58px;aspect-ratio:1;border-radius:22%;display:block;box-shadow:0 0 0 1px var(--line)}
.ic[aria-pressed="true"]{color:var(--ink);font-weight:700}
.ic[aria-pressed="true"] img{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.ic:active{transform:scale(.94)}
.hint{margin:10px 2px 0;font-size:.8em;color:var(--muted)}
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:linear-gradient(160deg,#FFD54F,#FBBC04);color:#202124;overflow:hidden;transition:opacity .5s ease,transform .5s ease}
@media (prefers-color-scheme: dark){#intro{background:radial-gradient(circle at 50% 42%,#2c2e33 0,#202124 62%);color:#E8EAED}}
#intro::before{content:"";position:absolute;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%);animation:iglow 1.6s ease both}
@media (prefers-color-scheme: dark){#intro::before{background:radial-gradient(circle,rgba(251,188,4,.22),transparent 65%)}}
#intro.out{opacity:0;transform:scale(1.05);pointer-events:none}
#intro svg{position:relative;width:132px;height:132px;overflow:visible}
.i-sheet{transform-origin:50% 60%;animation:isheet .75s cubic-bezier(.2,.9,.25,1.15) both}
.i-ln{stroke-dasharray:60;stroke-dashoffset:60;animation:idraw .5s ease forwards}
.i-ln.l1{animation-delay:.55s}.i-ln.l2{animation-delay:.8s}.i-ln.l3{animation-delay:1.05s}
.i-name{position:relative;font-size:1.9em;font-weight:700;letter-spacing:.05em;opacity:0;animation:iname .6s ease 1.05s forwards}
@keyframes isheet{from{opacity:0;transform:translateY(28px) scale(.8)}}
@keyframes idraw{to{stroke-dashoffset:0}}
@keyframes iname{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes iglow{from{opacity:0;transform:scale(.5)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="intro" aria-hidden="true">
  <svg viewBox="0 0 120 120"><g class="i-sheet"><path d="M30 14h42l24 24v58a10 10 0 0 1-10 10H30a10 10 0 0 1-10-10V24a10 10 0 0 1 10-10z" fill="#fff"/><path d="M72 14l24 24H82a10 10 0 0 1-10-10z" fill="#FFE9A6"/><line class="i-ln l1" x1="34" y1="56" x2="84" y2="56" pathLength="60" stroke="#3C4043" stroke-width="6" stroke-linecap="round"/><line class="i-ln l2" x1="34" y1="72" x2="84" y2="72" pathLength="60" stroke="#BDC1C6" stroke-width="6" stroke-linecap="round"/><line class="i-ln l3" x1="34" y1="88" x2="64" y2="88" pathLength="60" stroke="#BDC1C6" stroke-width="6" stroke-linecap="round"/></g></svg>
  <div class="i-name">Notes</div>
</div>
<div class="wrap">
  <div class="top">
    <div><h1>Notes</h1><div id="date" class="sub"></div></div>
    <button id="gear" class="icon" aria-label="Open settings">⚙</button>
  </div>
  <div id="wid" class="widget" role="button" tabindex="0" aria-label="Edit quote widget"></div>
  <div class="stick">
    <input id="q" class="search" type="search" placeholder="Search notes and labels" aria-label="Search notes">
    <div id="tabs" class="chips"></div>
    <div id="chips" class="chips"></div>
  </div>
  <main id="list" class="grid"></main>
</div>
<button id="new" class="fab">New note</button>

<div id="ed" class="sheet" hidden>
  <div class="panel" id="edp" role="dialog" aria-label="Edit note">
    <input id="t" type="text" placeholder="Title" aria-label="Title">
    <textarea id="b" placeholder="Write your note" aria-label="Note text"></textarea>
    <div id="items" hidden></div>
    <div class="row">
      <button id="catb" class="sel" aria-haspopup="listbox" aria-expanded="false"><span id="catv">No category</span><span aria-hidden="true">▾</span></button>
      <button id="listb" class="btn" aria-pressed="false">Checklist</button>
    </div>
    <input id="l" type="text" placeholder="Labels, separated by commas" aria-label="Labels">
    <div class="row" id="sw"></div>
    <div class="row">
      <button id="pinb" class="btn" aria-pressed="false">Pin</button>
      <button id="del" class="btn">Delete</button>
      <span class="sp"></span>
      <button id="done" class="btn main">Save</button>
    </div>
  </div>
</div>

<div id="menu" class="menu" role="listbox" hidden></div>

<div id="st" class="sheet" hidden>
  <div class="panel set" role="dialog" aria-label="Settings">
    <div class="sethead"><h2 class="ttl">Settings</h2><button id="stdone" class="btn main">Done</button></div><div id="setbody"></div>
    
  </div>
</div>

<div id="wd" class="sheet" hidden>
  <div class="panel" role="dialog" aria-label="Edit quote">
    <textarea id="wt" class="field" placeholder="Write a quote or a message" aria-label="Quote text"></textarea>
    <div class="row"><label for="wdays">Show for (days)</label><input id="wdays" class="field" type="number" min="0" max="365" inputmode="numeric"></div>
    <div class="row" id="wpre">
      <button class="btn" data-d="1">1 day</button><button class="btn" data-d="7">1 week</button><button class="btn" data-d="30">1 month</button><button class="btn" data-d="0">Always</button>
    </div>
    <div class="row"><button id="wclear" class="btn">Clear</button><span class="sp"></span><button id="wsave" class="btn main">Save</button></div>
  </div>
</div>

  var t=q.toLowerCase();
  var list=S.notes.filter(function(n){
    return (!cat||n.cat===cat)&&(!lab||n.labels.indexOf(lab)>-1)&&(!t||(n.title+' '+n.body+' '+n.items.map(function(i){return i.t}).join(' ')+' '+n.cat+' '+n.labels.join(' ')).toLowerCase().indexOf(t)>-1);
  }).sort(function(a,b){return b.updated-a.updated});
  var pin=list.filter(function(n){return n.pin}),rest=list.filter(function(n){return !n.pin});
  var h='';
  if(pin.length)h+='<h2>Pinned</h2><div class="cols">'+pin.map(card).join('')+'</div>';
  if(rest.length)h+=(pin.length?'<h2>Other notes</h2>':'')+'<div class="cols">'+rest.map(card).join('')+'</div>';
  if(!list.length)h='<p class="empty">'+(S.notes.length?'No notes here yet.':'No notes yet. Tap New note to write your first one.')+'</p>';
  $('#list').className=S.set.layout==='list'?'list':'grid';
  $('#list').innerHTML=h;flash='';
  wid();
}
/* editor */
function stylePanel(){var p=$('#edp');p.style.background=cur.bg||'';p.style.color=cur.bg?inkFor(cur.bg):''}
function swatches(){
  $('#sw').innerHTML=NBG.map(function(v){return '<button class="dot sm'+(cur.bg===v?' on bump':'')+(v===''?' auto':'')+'" data-bg="'+v+'" style="'+(v?'background:'+v:'')+'" aria-label="'+(v?'Note color '+v:'Default note color')+'"></button>'}).join('')+
    '<label class="dot sm pick" aria-label="Custom note color"><input type="color" id="nbgc" value="'+(hex(cur.bg)||'#cccccc')+'"></label>';
  stylePanel();
}
function showMode(){
  $('#b').hidden=cur.list;$('#items').hidden=!cur.list;
  $('#listb').setAttribute('aria-pressed',String(cur.list));
  if(cur.list)drawItems();
}
function drawItems(focusI){
  $('#items').innerHTML=cur.items.map(function(it,i){return '<div class="it"><input type="checkbox" data-i="'+i+'"'+(it.d?' checked':'')+' aria-label="Done"><input type="text" class="itx" data-i="'+i+'" value="'+esc(it.t)+'" placeholder="Item" aria-label="Item"><button class="x" data-x="'+i+'" aria-label="Remove item">✕</button></div>'}).join('')+'<div><button class="btn" id="addit">Add item</button></div>';
  if(focusI!==undefined){var el=$('.itx[data-i="'+focusI+'"]');if(el)el.focus()}
}
function openEd(id){
  if(id){cur=JSON.parse(JSON.stringify(S.notes.filter(function(n){return n.id===id})[0]))}
  else{var l=(cat==='Groceries'||cat==='Daily routine');cur={id:null,title:'',body:'',items:l?[{t:'',d:false}]:[],list:l,labels:[],bg:'',pin:false,cat:cat,updated:0}}
  armed=false;$('#del').textContent='Delete';$('#del').classList.remove('arm');
  $('#t').value=cur.title;$('#b').value=cur.body;$('#l').value=cur.labels.join(', ');
  setCat(cur.cat);
  $('#pinb').setAttribute('aria-pressed',String(cur.pin));$('#pinb').textContent=cur.pin?'Pinned':'Pin';
  $('#del').hidden=!cur.id;swatches();showMode();openS($('#ed'));
  if(!cur.id)setTimeout(function(){$('#t').focus({preventScroll:true})},330);
}
function closeEd(){
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();cur.title=$('#t').value.trim();
  cur.labels=$('#l').value.split(',').map(function(s){return s.trim()}).filter(function(s,i,a){return s&&a.indexOf(s)===i});
  if(cur.list){cur.items=cur.items.filter(function(i){return i.t.trim()});cur.body=''}
  else{cur.body=$('#b').value.trim();cur.items=[]}
  var idx=-1;if(cur.id)S.notes.forEach(function(n,i){if(n.id===cur.id)idx=i});
  if(!cur.title&&!cur.body&&!cur.items.length){if(idx>-1)S.notes.splice(idx,1)}
  else{cur.updated=Date.now();if(idx>-1)S.notes[idx]=cur;else{cur.id=String(Date.now());S.notes.push(cur)}flash=cur.id}
  save();closeMenu();shut($('#ed'));setTimeout(render,200);
}
$('#items').addEventListener('input',function(e){var i=e.target.getAttribute('data-i');if(i!==null&&e.target.classList.contains('itx'))cur.items[+i].t=e.target.value});
$('#items').addEventListener('change',function(e){var i=e.target.getAttribute('data-i');if(i!==null&&e.target.type==='checkbox')cur.items[+i].d=e.target.checked});
$('#items').addEventListener('click',function(e){
  var x=e.target.closest('[data-x]');
  if(x){cur.items.splice(+x.getAttribute('data-x'),1);drawItems();return}
  if(e.target.id==='addit'){cur.items.push({t:'',d:false});drawItems(cur.items.length-1)}
});
$('#items').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.classList.contains('itx')){e.preventDefault();var i=+e.target.getAttribute('data-i');cur.items.splice(i+1,0,{t:'',d:false});drawItems(i+1)}
});
$('#listb').addEventListener('click',function(){
  if(!cur.list){
    cur.items=$('#b').value.split('\n').filter(function(s){return s.trim()}).map(function(s){return {t:s.trim(),d:false}});
    if(!cur.items.length)cur.items=[{t:'',d:false}];cur.list=true;
  }else{$('#b').value=cur.items.map(function(i){return i.t}).filter(Boolean).join('\n');cur.list=false}
  showMode();
});
$('#sw').addEventListener('click',function(e){var b=e.target.closest('[data-bg]');if(b){cur.bg=b.getAttribute('data-bg');swatches()}});
$('#sw').addEventListener('input',function(e){if(e.target.id==='nbgc'){cur.bg=e.target.value;stylePanel()}});
$('#pinb').addEventListener('click',function(){cur.pin=!cur.pin;this.setAttribute('aria-pressed',String(cur.pin));this.textContent=cur.pin?'Pinned':'Pin'});
$('#del').addEventListener('click',function(){
  if(!armed){armed=true;this.textContent='Tap again to delete';this.classList.add('arm');return}
  S.notes=S.notes.filter(function(n){return n.id!==cur.id});save();shut($('#ed'));setTimeout(render,200);
});
$('#done').addEventListener('click',closeEd);
$('#ed').addEventListener('click',function(e){if(e.target===$('#ed'))closeEd()});
function setCat(v){cur.cat=v;$('#catv').textContent=v||'No category'}
function closeMenu(){$('#menu').hidden=true;$('#catb').setAttribute('aria-expanded','false')}
function openMenu(){
  var m=$('#menu'),b=$('#catb'),r=b.getBoundingClientRect();
  var opts=[''];if(cur.cat&&S.cats.indexOf(cur.cat)<0)opts.push(cur.cat);opts=opts.concat(S.cats);
  m.innerHTML=opts.map(function(c){return '<button class="mi" role="option" data-v="'+esc(c)+'" aria-selected="'+(c===cur.cat)+'"><span>'+(c?esc(c):'No category')+'</span><i class="rd"></i></button>'}).join('');
  m.style.minWidth=Math.max(r.width,230)+'px';m.hidden=false;
  var h=m.offsetHeight,w=m.offsetWidth,below=window.innerHeight-r.bottom,up=below<h+16&&r.top>below;
  m.style.top=(up?Math.max(8,r.top-h-6):r.bottom+6)+'px';
  m.style.left=Math.max(8,Math.min(r.left,window.innerWidth-w-8))+'px';
  m.style.transformOrigin=(up?'bottom':'top')+' left';
  b.setAttribute('aria-expanded','true');
}
$('#catb').addEventListener('click',function(e){e.stopPropagation();if($('#menu').hidden)openMenu();else closeMenu()});
$('#menu').addEventListener('click',function(e){var b=e.target.closest('.mi');if(b){setCat(b.getAttribute('data-v'));closeMenu()}});
document.addEventListener('click',function(e){if(!$('#menu').hidden&&!e.target.closest('#menu'))closeMenu()});
/* main list */
$('#q').addEventListener('input',function(e){q=e.target.value;render()});
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('[data-c]');if(b){cat=b.getAttribute('data-c');render()}});
$('#chips').addEventListener('click',function(e){var b=e.target.closest('[data-l]');if(b){lab=b.getAttribute('data-l');render()}});
$('#list').addEventListener('click',function(e){
  var cb=e.target.closest('.cb');
  if(cb){var n=S.notes.filter(function(x){return x.id===cb.getAttribute('data-id')})[0],i=+cb.getAttribute('data-i');n.items[i].d=!n.items[i].d;n.updated=Date.now();save();render();return}
  var c=e.target.closest('.card');if(c)openEd(c.getAttribute('data-id'));
});
$('#list').addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.classList.contains('card'))openEd(e.target.getAttribute('data-id'))});
$('#new').addEventListener('click',function(){openEd(null)});
/* widget */
function openWid(){
  var w=S.widget;$('#wt').value=w.text||'';
  $('#wdays').value=w.until?Math.max(1,Math.ceil((w.until-Date.now())/864e5)):0;
  openS($('#wd'));setTimeout(function(){$('#wt').focus({preventScroll:true})},330);
}
$('#wid').addEventListener('click',openWid);
$('#wid').addEventListener('keydown',function(e){if(e.key==='Enter')openWid()});
$('#wpre').addEventListener('click',function(e){var b=e.target.closest('[data-d]');if(b)$('#wdays').value=b.getAttribute('data-d')});
$('#wsave').addEventListener('click',function(){
  var t=$('#wt').value.trim(),days=Math.max(0,Math.min(365,parseInt($('#wdays').value,10)||0));
  S.widget={text:t,until:t&&days?Date.now()+days*864e5:0};save();wid();shut($('#wd'));
});
$('#wclear').addEventListener('click',function(){S.widget={text:'',until:0};save();wid();shut($('#wd'))});
$('#wd').addEventListener('click',function(e){if(e.target===$('#wd'))shut($('#wd'))});
/* settings */
function pal(key,list,custom){
  return '<div class="row">'+list.map(function(v){
    return '<button class="dot'+(S.set[key]===v?' on':'')+(v===''?' auto':'')+'" data-s="'+key+'" data-v="'+esc(v)+'" style="'+(v?'background:'+esc(v):'')+'" aria-label="'+(v?esc(v):'Default')+'"></button>';
  }).join('')+(custom?'<label class="dot pick" aria-label="Custom color"><input type="color" data-ci="'+key+'" value="'+(hex(S.set[key])||'#888888')+'"></label>':'')+'</div>';
}
function seg(key,opts){return '<div class="seg">'+opts.map(function(o){return '<button class="sg" data-s="'+key+'" data-v="'+o[0]+'" aria-pressed="'+(String(S.set[key])===String(o[0]))+'">'+o[1]+'</button>'}).join('')+'</div>'}
function grp(t,k,inner){return '<section class="grp"><div class="gh"><h3>'+t+'</h3><button class="lnk" data-def="'+k+'">Default</button></div>'+inner+'</section>'}
function syncSet(){
  var els=document.querySelectorAll('#st [data-s]');
  for(var i=0;i<els.length;i++){var el=els[i],on=String(S.set[el.getAttribute('data-s')])===el.getAttribute('data-v');if(el.classList.contains('dot'))el.classList.toggle('on',on);else el.setAttribute('aria-pressed',String(on))}
  var ci=document.querySelectorAll('#st [data-ci]');
  for(var j=0;j<ci.length;j++){ci[j].value=hex(S.set[ci[j].getAttribute('data-ci')])||'#888888'}
}
function openSet(){
  var fonts='<div class="fl">'+Object.keys(FONTS).map(function(f){return '<button class="fr" data-s="font" data-v="'+f+'" aria-pressed="'+(S.set.font===f)+'"><span style="font-family:\''+f+'\',serif">'+f+(f===DEF.font?' (default)':'')+'</span><i class="rd"></i></button>'}).join('')+'</div>';
  var cats='<div class="cl">'+S.cats.map(function(c){return '<div class="cr"><span>'+esc(c)+'</span><button class="x" data-rc="'+esc(c)+'" aria-label="Remove category '+esc(c)+'">\u2715</button></div>'}).join('')+'</div><div class="row" style="margin-top:8px"><input id="catin" class="field" type="text" placeholder="New category" maxlength="24" aria-label="New category" style="flex:1"><button id="addcat" class="btn">Add</button></div>';
  var icons='<div class="icg">'+Object.keys(ICONS).map(function(k){return '<button class="ic" data-s="icon" data-v="'+k+'" aria-pressed="'+(S.set.icon===k)+'"><img src="'+ICONS[k]+'" alt=""><span>'+ICONNAMES[k]+'</span></button>'}).join('')+'</div><p class="hint">'+iconHint()+'</p>';
  $('#setbody').innerHTML=
    grp('Theme','theme',seg('theme',[['auto','Match phone'],['light','Light'],['dark','Dark']]))+
    grp('Layout','layout',seg('layout',[['grid','Grid'],['list','List']]))+
    grp('Text size','size',seg('size',[[14,'Small'],[16,'Medium'],[19,'Large']]))+
    grp('Font','font',fonts)+
    grp('App background','bg',pal('bg',BGS,true))+
    grp('Text color','ink',pal('ink',INKS,true))+
    grp('Header color','head',pal('head',HEADS,true))+
    grp('Notes icon and buttons','accent',pal('accent',ACCS,true))+
    grp('App icon','icon',icons)+
    grp('Categories','cats',cats)+
    '<button id="reset" class="reset">Reset everything to default</button>';
  openS($('#st'));
  setTimeout(function(){Object.keys(FONTS).forEach(loadFont)},400);
}
$('#gear').addEventListener('click',openSet);
$('#stdone').addEventListener('click',function(){shut($('#st'))});
$('#st').addEventListener('click',function(e){
  if(e.target===$('#st')){shut($('#st'));return}
  var b=e.target.closest('[data-s]'),r=e.target.closest('[data-rc]');
  if(b){var k=b.getAttribute('data-s'),v=b.getAttribute('data-v');S.set[k]=k==='size'?+v:v;commit(k!=='layout');syncSet();if(k==='icon')nativeIcon(v);b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');return}
  var df=e.target.closest('[data-def]');
  if(df){var dk=df.getAttribute('data-def');if(dk==='cats'){S.cats=DEFCATS.slice();cat='';commit();openSet()}else{S.set[dk]=DEF[dk];commit(dk!=='layout');syncSet();if(dk==='icon')nativeIcon(DEF.icon)}return}
  if(r){var c=r.getAttribute('data-rc');S.cats=S.cats.filter(function(x){return x!==c});S.notes.forEach(function(n){if(n.cat===c)n.cat=''});if(cat===c)cat='';commit();openSet();return}
  if(e.target.id==='addcat'){var v2=$('#catin').value.trim();if(v2&&S.cats.indexOf(v2)<0){S.cats.push(v2);commit();openSet()}return}
  if(e.target.id==='reset'){S.set=Object.assign({},DEF);commit();syncSet();nativeIcon(DEF.icon)}
});
var ct;$('#st').addEventListener('input',function(e){var k=e.target.getAttribute('data-ci');if(k){S.set[k]=e.target.value;apply();clearTimeout(ct);ct=setTimeout(save,300)}});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(!$('#menu').hidden)closeMenu();else if(!$('#ed').hidden)closeEd();else{shut($('#st'));shut($('#wd'))}
});
$('#date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
window.__back=function(){
  if(!$('#menu').hidden){closeMenu();return true}
  if(!$('#ed').hidden){closeEd();return true}
  if(!$('#st').hidden){shut($('#st'));return true}
  if(!$('#wd').hidden){shut($('#wd'));return true}
  return false;
};
apply();render();
var intro=$('#intro');
function endIntro(){introDone=true;pushBars(pendingBar);if(!intro)return;intro.classList.add('out');setTimeout(function(){if(intro.parentNode)intro.parentNode.removeChild(intro)},650)}
var reduceMo=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
setTimeout(endIntro,reduceMo?250:1900);
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js')}catch(e){}})}</script>
</body>
</html>
